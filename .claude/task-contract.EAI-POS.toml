schema_version = 2
agent_tree = true
notes = "EAI-POS: EasyAI project modes Position | Detect and a per-instance Segment AI head (oriented box, circle). Plan not yet approved."

[task]
id = "EAI-POS"
title = "EasyAI project modes Position | Detect with a per-instance native Segment AI head"
goal = "Add two project modes to EasyAI. Position: only oriented rectangles and circles, native Segment AI must output one oriented box or circle per object (touching or overlapping objects are separated automatically). Detect: defect detection as today, but it uses the same new per-instance head. One new head for both modes. User-selectable Performance / Quality option controls the position and angle error (fast with larger error, or accurate with error near zero)."
current_behavior = "EasyAI has no project mode. Native Segment AI V2 (BeeNativeSegAI SegV2Core) is a per-pixel semantic head (MLP 448-32-K, softmax) on a frozen MobileNetV2 backbone; inference takes connected components of the class mask, so touching objects merge into one region (recall <= .56 on images with many touching objects). Circle and line shapes are skipped when labels become training masks. Label canvas supports polygon, rectangle, oriented_rectangle, circle, line, point, AI tools."
expected_behavior = "1) Project has a mode (Position | Detect) chosen at creation and stored in the project file; old projects load as Detect. 2) Position mode: label tools limited to oriented rectangle and circle; training labels use them directly (no polygon/mask labelling); inference returns one oriented box (cx, cy, w, h, angle) or circle (cx, cy, r) per object with a score. 3) A new instance head in the native Segment AI (centre heatmap + size + angle sin/cos + radius) trained from those labels, used by both modes; touching objects are separated without manual work. 4) Performance/Quality option for position and angle error. 5) Detect mode keeps its current behaviour for defect detection."
in_scope = [
  "BeeNativeSegAI/** (instance head trainer and inferer, C API additions, .segai format version, native tests)",
  "EasyLabel/src/EasyLabel.SegAI/**, EasyLabel/src/EasyLabel.Core/** (project mode, shape rules, converters)",
  "EasyLabel/src/EasyAI.Wpf/** (project dialog, tool palette per mode, Train tab, suggestions)",
  "EasyLabel/tests/**, tmp/EAI-POS, artifacts/EAI-POS",
]
out_of_scope = [
  "EasyVision runtime (BeeCore, BeeInterface, tools) and any hardware path",
  "Defect-detection algorithm changes beyond swapping in the new head",
  "Deploying the native DLL into bin/Release or lib/native",
  "BeeLicense.dll (never rebuild into Release)",
]
dependencies = ["EAI-CLS (named class API, already in native)", "EAI-LABEL (SAM2 refine, Speed/Effort UI) is separate"]
risk = "high"

[dispatch]
category = "feature"
route = "deep"
normalized_request = "Nâng cấp Project EasyAI thành 2 mode Position | Detect lỗi. Position chỉ box xoay + circle; Native Segment AI phải output box xoay và circle theo từng vật (vật chồng/chạm nhau tự tách lớp). Head mới theo từng vật dùng chung cho Position và Detect. Option Performance (nhanh, sai số lớn) | Quality (sai số vị trí và góc gần 0). Detect giữ như cũ."
selected_model = "sonnet"
