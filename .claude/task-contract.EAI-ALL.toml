approved_at_utc = "2026-10-11T09:00:00Z"

[authorization]
granted_by = "user"
current_task_reference = "EAI-ALL"
granted_at_utc = "2026-10-11T09:00:00Z"
edit_code = true
update_tracking = false
build = true
run_tests = true
benchmark = true
deploy = false
