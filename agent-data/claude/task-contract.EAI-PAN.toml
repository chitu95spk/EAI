schema_version = 2
agent_tree = true
notes = "EAI-PAN: EasyAI canvas Hand/Pan tool (key H) and Keep-previous-zoom view position fix. User request 2026-10-17 (vi): 'Canvas chua co Pan de move anh' and 'khi chon Giu muc thu phong, zoom vao, chuyen hinh tiep theo thi nhay vi tri scroll'. User chose: Hand tool + key H (not Space-drag, not scrollbars). Existing: middle-button drag already pans (AnnotationCanvas.BeginPan)."

[task]
id = "EAI-PAN"
title = "EasyAI canvas: Hand (Pan) tool with H key, and keep the view position when Keep previous zoom is on"
goal = "(1) A Hand tool in the canvas tool strip (existing custom tool buttons, existing icon style) bound to the key H: while it is active, dragging with the left mouse button moves the image; middle-button drag keeps working; leaving the tool restores the previous tool. Wheel zoom and fit keep working. (2) With 'Keep previous zoom' on, after the user zooms in and moves to the next image the view must stay where it was (same zoom, same view position), not jump."
current_behavior = "Pan exists only on the middle mouse button (AnnotationCanvas.OnMouseDown -> BeginPan), not discoverable. AnnotationCanvas.OnImageReplaced with KeepPreviousZoom keeps the scale but re-centres the new image in the view (offset = (viewSize - imageSize*scale)/2), so a zoomed-in view jumps to the image centre on every image change."
expected_behavior = "Hand tool button + H (H must not clash with an existing shortcut; ShortcutTable and the shortcut settings list include it with vi/en labels). Pan with the Hand tool is left-drag, shows a hand/grab cursor, does not create or edit annotations and does not start AI box drag or suggestion clicks. Keep previous zoom: the image-space point at the view centre is kept as a fraction of the image size (for equal-size images the offsets stay identical), so the next image appears at the same view position; if the new image has a different size the same fractional centre is used and the result is clamped so the image is not lost outside the view; when Keep previous zoom is off, behaviour is unchanged (fit). The first image (no previous view) still fits."
in_scope = [
  "EasyLabel/src/EasyAI.Wpf/Canvas/AnnotationCanvas.cs, ToolStripView.xaml(.cs), CanvasView.xaml(.cs)",
  "EasyLabel/src/EasyAI.Wpf/Infrastructure/ShortcutTable.cs and the files that declare ShortcutId, tool enums and the canvas tool state (ViewModels/CanvasViewModel.cs and the tool/edit-session types it uses)",
  "EasyLabel/src/EasyAI.Wpf/Resources/Strings*.resx, Strings.Designer.cs (new keys only, vi and en identical)",
  "A small pure helper for the keep-view math (for example in the ViewTransform file) so it can be unit tested",
  "EasyLabel/tests/EasyLabel.SegAI.Tests (new tests, csproj Compile links), tmp/EAI-PAN, artifacts/EAI-PAN",
]
out_of_scope = [
  "EasyVision runtime (BeeCore, BeeInterface, tools) and any hardware path",
  "Space/Fit shortcut behaviour, annotation editing logic, AI suggestion logic",
  "Scrollbars, new settings pages, licence, installer",
  "BeeLicense.dll (never rebuild into Release)",
]
dependencies = ["Pre-existing uncommitted edits by other sessions in ShortcutTable.cs, CanvasView.xaml.cs, MainWindow*, Strings*.resx must be preserved"]
risk = "low"

