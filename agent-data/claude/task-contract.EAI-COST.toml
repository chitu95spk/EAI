notes = "EAI-COST: EasyAI agent spend control, image-upload consent and offline-only switch. Source findings: tmp/EAI-COMMERCIAL/backend-review.md BE-01..BE-04, customer-operator.md CU-01/CU-02, customer-buyer.md CB-07/CB-08. Plan not yet approved; no authorization granted."

[task]
id = "EAI-COST"
title = "EasyAI agent cost enforcement, upload consent and offline-only mode"
goal = "Make the agent labelling path commercially safe: (1) the USD caps (default 1 USD per batch, 5 USD per day) are enforced DURING a run, not only after it; (2) every agent call (label runs, suggest-prompt, prompt sub-agent, Codex, cancelled and timed-out runs) is recorded with a cost in one tamper-resistant ledger that the caps read; (3) before any image leaves the PC the user gives explicit per-project consent; (4) an Offline-only switch disables every network/LLM feature and the app still works for local labelling, training and testing."
current_behavior = "Per review (static reading, not yet verified by run): claude -p is started without --max-budget-usd and caps are checked only after a run ends, so one run can overshoot and N parallel workers overshoot by N runs (BE-01). Cancelled and timed-out runs log cost 0 (BE-02). Suggest-prompt and the prompt sub-agent are not logged, so the daily cap never sees them; the daily cap reads a plain log.csv that can be deleted; Codex runs carry no cost (BE-03, BE-04). No consent step exists before crops/images are sent to Claude/Codex and there is no offline-only switch (CU-01, CU-02, CB-07)."
expected_behavior = "1) Before starting a run the app computes a per-run budget = min(remaining batch cap, remaining day cap) and passes it to the CLI where supported (claude --max-budget-usd) and enforces it with a local watchdog that kills the run when the running cost estimate reaches it. 2) Parallel workers share one budget reservation, so total spend cannot exceed the batch cap. 3) Cancel, timeout, crash and failed runs record the cost actually incurred or a documented conservative estimate, never 0. 4) Suggest-prompt, prompt sub-agent and Codex runs are written to the same ledger with cost or an estimate flagged as estimated. 5) The ledger is append-only with a per-record integrity check; deleting or editing it is detected and the app falls back to the conservative assumption that the day cap is exhausted until the user acknowledges. 6) First agent use in a project shows a plain-language consent dialog (what is sent, to whom, approximate cost) in Vietnamese and English; consent is stored per project and revocable. 7) Settings has an Offline-only switch; when on, agent, MCP-remote, model download and update-check commands are disabled with a plain explanation, and no network call is made. 8) All user-visible text for these features exists in vi and en resources, with no raw exception text."
in_scope = [
  "EasyLabel/src/EasyLabel.Ai/**, EasyLabel/src/EasyLabel.Ai.Mcp/** (run launching, budget flags, ledger, cost parsing)",
  "EasyLabel/src/EasyAI.Wpf/Services/Agent/**, ViewModels/AgentsSettingsViewModel.cs, ViewModels/SettingsViewModel.cs, LabelStepViewModel.AgentChat.cs (budget wiring, consent, offline gating)",
  "EasyLabel/src/EasyAI.Wpf/Resources/Strings*.resx and the consent/settings XAML needed for the new dialog and switch",
  "EasyLabel/src/EasyLabel.Core/** only for project-file keys needed by consent (unknown keys must survive)",
  "EasyLabel/src/EasyAI.Wpf/Services/AgentRunner.cs, ViewModels/LabelStepViewModel.cs, Infrastructure/AppSettings.cs, SettingsAccessor.cs, SettingsModel.cs (scope revision approved by user 2026-10-17)",
  "EasyLabel/tests/**, tmp/EAI-COST, artifacts/EAI-COST",
]
out_of_scope = [
  "EasyVision runtime (BeeCore, BeeInterface, tools) and any hardware path",
  "Command-code registry restructure (separate contract, phases CC-0..CC-11)",
  "Online realtime mode (separate contract EAI-ONL)",
  "Training pipeline changes (checkpoint, seed, priority) - separate contract",
  "Licence/activation, installer, updater",
  "BeeLicense.dll (never rebuild into Release)",
]
dependencies = ["EAI-LABEL agent chat (already committed)", "tmp/EAI-COMMERCIAL/backend-review.md BE-01..BE-04, BE-15 (verify _killed flag first)"]
risk = "medium"

