[acceptance]
behavior = [
  "A run whose estimated cost reaches the remaining batch cap is stopped by the watchdog; total recorded spend for the batch never exceeds the cap by more than one documented granularity unit.",
  "With N parallel workers the combined spend stays within the batch cap (shared reservation).",
  "Cancelled, timed-out and crashed runs appear in the ledger with a non-zero cost or an explicit estimated flag.",
  "Suggest-prompt, prompt sub-agent and Codex runs appear in the ledger and count toward the day cap.",
  "Deleting or editing the ledger file is detected; the day cap is treated as exhausted until acknowledged.",
  "First agent use in a project shows the consent dialog (vi and en); declining sends nothing; consent is stored per project and can be revoked.",
  "With Offline-only on, no outbound network call is made by any EasyAI feature (verified by a test seam that fails on any HttpClient/process-launch of an agent CLI) and local label/train/test still work.",
  "No raw exception text or internal terms (ONNX, .venv, CUDA, exit code) reach the user in the new dialogs or notices.",
]
regression = [
  "Existing EasyLabel.Ai, Ai.Mcp, Core and SegAI test projects pass.",
  "Old project files without consent keys open; unknown keys survive a save.",
  "vi/en resource key sets stay identical.",
]
performance = [
  "Watchdog and ledger writes add no measurable delay to the UI thread (no synchronous disk I/O on the UI thread).",
]
evidence_required = [
  "Build log summary (error count, warning count versus baseline) and test logs saved under artifacts/EAI-COST/<run>/.",
  "A run log from a fake/stub agent process showing budget kill, cancel cost, parallel reservation and ledger tamper detection.",
  "UI smoke of the consent dialog and Offline switch at 100% and 150% DPI in vi and en - owed unless the user authorizes a UI run; report as unverified otherwise.",
]

